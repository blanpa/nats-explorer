name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-x64
            ext: ""
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            name: macos-x64
            ext: ""
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      # Build client
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter shared build
      - run: pnpm --filter client build

      # Build Go server
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go-server/go.sum
      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go-server
          go build -ldflags="-s -w" -o ../dist/nats-explorer${{ matrix.ext }} .

      # Package
      - name: Create archive
        run: |
          mkdir -p release/nats-explorer-${{ matrix.name }}
          cp dist/nats-explorer${{ matrix.ext }} release/nats-explorer-${{ matrix.name }}/
          cp -r client/dist release/nats-explorer-${{ matrix.name }}/public
          cd release
          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            zip -r nats-explorer-${{ matrix.name }}.zip nats-explorer-${{ matrix.name }}/
          else
            tar czf nats-explorer-${{ matrix.name }}.tar.gz nats-explorer-${{ matrix.name }}/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/nats-explorer-${{ matrix.name }}.*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: go-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-x64/*
            artifacts/linux-arm64/*
            artifacts/windows-x64/*
            artifacts/macos-x64/*
            artifacts/macos-arm64/*
