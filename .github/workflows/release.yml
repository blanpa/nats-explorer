name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # Headless server binaries (cross-compiled, no CGO)
  build-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-x64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: windows
            goarch: amd64
            name: windows-x64
          - goos: darwin
            goarch: amd64
            name: macos-x64
          - goos: darwin
            goarch: arm64
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter shared build
      - run: pnpm --filter client build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go-server/go.sum
      - name: Build server binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go-server
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" -o ../dist/nats-explorer${ext} .
      - name: Package
        run: |
          ext=""
          if [ "${{ matrix.name }}" = "windows-x64" ]; then ext=".exe"; fi
          mkdir -p release/nats-explorer-server-${{ matrix.name }}
          cp dist/nats-explorer${ext} release/nats-explorer-server-${{ matrix.name }}/
          cp -r client/dist release/nats-explorer-server-${{ matrix.name }}/public
          cd release
          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            zip -r nats-explorer-server-${{ matrix.name }}.zip nats-explorer-server-${{ matrix.name }}/
          else
            tar czf nats-explorer-server-${{ matrix.name }}.tar.gz nats-explorer-server-${{ matrix.name }}/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: release/nats-explorer-server-${{ matrix.name }}.*

  # Desktop app (native build, needs CGO + system webview)
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            name: windows-x64
            ext: ".exe"
            archive: zip
          - os: macos-latest
            name: macos-arm64
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter shared build
      - run: pnpm --filter client build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go-server/go.sum

      # Linux: install webkit2gtk
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Copy frontend build into go-server for embedding
      - name: Prepare frontend for embedding
        run: |
          mkdir -p go-server/frontend
          cp -r client/dist go-server/frontend/dist

      - name: Build desktop app
        shell: bash
        run: |
          cd go-server
          CGO_ENABLED=1 go build -tags desktop -ldflags="-s -w" -o ../dist/nats-explorer${{ matrix.ext }} .

      - name: Package
        shell: bash
        run: |
          mkdir -p release/nats-explorer-desktop-${{ matrix.name }}
          cp dist/nats-explorer${{ matrix.ext }} release/nats-explorer-desktop-${{ matrix.name }}/
          cd release
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a nats-explorer-desktop-${{ matrix.name }}.zip nats-explorer-desktop-${{ matrix.name }}/
          else
            tar czf nats-explorer-desktop-${{ matrix.name }}.tar.gz nats-explorer-desktop-${{ matrix.name }}/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release/nats-explorer-desktop-${{ matrix.name }}.*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: go-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-server, build-desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-*64'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/server-linux-x64/*
            artifacts/server-linux-arm64/*
            artifacts/server-windows-x64/*
            artifacts/server-macos-x64/*
            artifacts/server-macos-arm64/*
            artifacts/desktop-linux-x64/*
            artifacts/desktop-windows-x64/*
            artifacts/desktop-macos-arm64/*
