<!-- The source every icon is rendered from (e2e/icons.mjs): the application
     icons, the Windows and Store logos and the one on the documentation
     site. The header mark and the favicon are the same drawing without the
     fold, which no one sees at their size.

     A message leaving its publisher and spreading out through ">", the
     wildcard for everything below a subject: what the application subscribes
     to, and the chevron that opens a branch of its tree. The tile is
     ultramarine, and the accent of the interface is its hue, lightened or
     darkened until text in it reads (client/src/index.css).

     Drawn on a 32 unit grid with the tile from 0.5 to 31.5. The viewBox adds
     the margin the Linux and macOS icon grids ask for; an icon that fills its
     canvas (Windows, the documentation site) is this drawing with
     viewBox="0 0 32 32".

     No two hyphens in a row in here: that is not XML, and librsvg, which
     draws the icon of the Flatpak, refuses the file a browser still shows. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-3.5 -3.5 39 39">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6577ff"/>
      <stop offset="1" stop-color="#2a2ecf"/>
    </linearGradient>
    <!-- The lower arm lies under the upper one and is shaded where it disappears. -->
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="25.7" y1="16" x2="17.9" y2="23.8">
      <stop offset="0" stop-color="#c8cdfb"/>
      <stop offset=".55" stop-color="#fff"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="31" height="31" rx="7" fill="url(#tile)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.1" cy="16" r="2.6" fill="#fff" stroke="none"/>
    <path d="M12 11.8 16.2 16 12 20.2" stroke-width="3" stroke-opacity=".68"/>
    <path d="M25.7 16 17.9 23.8" stroke="url(#fold)" stroke-width="3.7"/>
    <path d="M17.9 8.2 25.7 16" stroke-width="3.7"/>
  </g>
</svg>
