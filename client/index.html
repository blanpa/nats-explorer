<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>NATS Explorer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%2312161c%27%2F%3E%3Cpath%20d%3D%27M8%209.25V22.75M8%2012.75H15.4M8%2022.75H20.4%27%20stroke%3D%27%235aa9ff%27%20stroke-width%3D%272.6%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%2F%3E%3Ccircle%20cx%3D%278%27%20cy%3D%279.25%27%20r%3D%273%27%20fill%3D%27%235aa9ff%27%2F%3E%3Ccircle%20cx%3D%2719%27%20cy%3D%2712.75%27%20r%3D%273%27%20fill%3D%27%235aa9ff%27%2F%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%2722.75%27%20r%3D%273%27%20fill%3D%27%235aa9ff%27%2F%3E%3C%2Fsvg%3E" />
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('ne.theme');
          // stored as JSON since settings sync; older versions wrote the bare word
          if (t && t.charAt(0) === '"') t = JSON.parse(t);
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
