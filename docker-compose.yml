services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222", "--store_dir", "/data"]
    volumes:
      - nats-data:/data

  nats-explorer:
    build:
      context: .
      dockerfile: go-server/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    depends_on:
      - nats

volumes:
  nats-data:
