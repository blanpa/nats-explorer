services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222", "--store_dir", "/data"]
    volumes:
      - nats-data:/data

  nats-explorer:
    build:
      context: .
      dockerfile: go-server/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      # Keep a copy of every message for three days; the UI loads time ranges from it.
      - HISTORY_DB=/data/history.db
      - HISTORY_RETENTION=72h
    volumes:
      - explorer-data:/data
    depends_on:
      - nats

volumes:
  nats-data:
  explorer-data:
