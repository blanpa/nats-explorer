title: NATS Explorer
description: Desktop and web NATS management tool and message explorer
remote_theme: just-the-docs/just-the-docs
url: https://blanpa.github.io
baseurl: /nats-explorer

color_scheme: dark

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

aux_links:
  GitHub: https://github.com/blanpa/nats-explorer
  Releases: https://github.com/blanpa/nats-explorer/releases
  Sponsor: https://github.com/sponsors/blanpa
aux_links_new_tab: true

nav_enabled: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# "Edit this page on GitHub" under every page.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/blanpa/nats-explorer
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# Architecture diagrams are Mermaid; the theme loads it from the CDN.
mermaid:
  version: "10.9.1"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow

footer_content: 'Copyright &copy; 2026 blanpa. <a href="https://github.com/blanpa/nats-explorer/blob/main/LICENSE">GNU AGPL v3.0 or later</a>. NATS is a trademark of the Linux Foundation.'
