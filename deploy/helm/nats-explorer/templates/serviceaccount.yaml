{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nats-explorer.serviceAccountName" . }}
  labels:
    {{- include "nats-explorer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The UI never talks to the Kubernetes API
automountServiceAccountToken: false
{{- end }}
