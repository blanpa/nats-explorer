{{- if and (eq .Values.auth.mode "token") (not .Values.auth.secretName) }}
{{- $name := include "nats-explorer.authSecretName" . }}
{{- $token := .Values.auth.token }}
{{- if not $token }}
{{- /* keep a generated token across upgrades */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $token = get $data "token" | b64dec | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "nats-explorer.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
