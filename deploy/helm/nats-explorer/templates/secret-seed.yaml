{{- if include "nats-explorer.seedEnabled" . }}
{{- /*
Seeds STORAGE_DIR the way the server stores settings: settings.json holds the
`ne.*` entries with the credential fields removed, secrets.json holds those
fields per connection under "conn:<id>" (see go-server/internal/settings).
*/}}
{{- $secretFields := list "token" "pass" "nkeySeed" "creds" "tlsKey" "sysToken" "sysPass" "sysNkeySeed" "sysCreds" "sshPassword" "sshKey" "sshPassphrase" }}
{{- $public := list }}
{{- $secrets := dict }}
{{- $seen := dict }}
{{- range $c := include "nats-explorer.connections" . | fromJsonArray }}
{{- $id := required "every connection needs an id" $c.id | toString }}
{{- if hasKey $seen $id }}{{ fail (printf "connection id %q is used twice" $id) }}{{ end }}
{{- $_ := set $seen $id true }}
{{- $pub := dict }}
{{- $sec := dict }}
{{- range $k, $v := $c }}
{{- if has $k $secretFields }}
{{- if $v }}{{ $_ := set $sec $k $v }}{{ end }}
{{- else }}
{{- $_ := set $pub $k $v }}
{{- end }}
{{- end }}
{{- $public = append $public $pub }}
{{- if $sec }}{{ $_ := set $secrets (printf "conn:%s" $id) (toJson $sec) }}{{ end }}
{{- end }}
{{- $entries := deepCopy .Values.seed.extraSettings }}
{{- range $k, $_ := $entries }}
{{- if not (hasPrefix "ne." $k) }}{{ fail (printf "seed.extraSettings: key %q must start with \"ne.\"" $k) }}{{ end }}
{{- end }}
{{- if $public }}{{ $_ := set $entries "ne.connections.v2" $public }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nats-explorer.fullname" . }}-seed
  labels: {{- include "nats-explorer.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.json: |
    {{- dict "version" 1 "entries" $entries | toPrettyJson | nindent 4 }}
  secrets.json: |
    {{- $secrets | toPrettyJson | nindent 4 }}
{{- end }}
