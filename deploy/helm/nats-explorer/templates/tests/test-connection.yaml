apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nats-explorer.fullname" . }}-test
  labels: {{- include "nats-explorer.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: wget
      # the app image is alpine based and already on the node
      image: {{ include "nats-explorer.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [sh, -c]
      args:
        - wget -qO- http://{{ include "nats-explorer.fullname" . }}:{{ .Values.service.port }}{{ include "nats-explorer.basePath" . }}/api/app
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
